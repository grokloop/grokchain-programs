[package]
name = "grok_chain_intents"
version = "0.1.0"
description = "Grok Chain intents + paymaster program (v1). Spec: SPEC.md. Sits on Solana L1. Not a VM, sequencer, or coin."
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "grok_chain_intents"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# Keep blake3 off 1.8+ so older platform-tools cargo can parse the graph.
blake3 = "=1.5.5"
# CORE identity/policy. Types + declare_id for check_grant CPI. Do not copy CORE source.
grok_chain_core = { path = "../../../grok-chain-core/programs/grok_chain_core", features = ["cpi"] }
