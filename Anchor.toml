# grok_chain_intents — MAINNET-PREP overlay. New program id. NOT the live DEVNET id.
# provider.cluster is Localnet on purpose: a stray `anchor deploy` must not talk to mainnet.
[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
grok_chain_intents = "3HCErAFs93FMk2J25Qq1xRRMp6B4FyGvif8ZV8hYxQKw"

[programs.mainnet]
grok_chain_intents = "3HCErAFs93FMk2J25Qq1xRRMp6B4FyGvif8ZV8hYxQKw"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
